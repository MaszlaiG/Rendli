<!--
  RENDLI — ÜGYFÉL-VISSZAIGAZOLÓ E-MAIL (templateCustomer)
  EmailJS template Content (Code / HTML). Settings fülön:
    To Email = {{to_email}} · From Name = {{from_name}} · Reply To = {{reply_to}} · Subject = {{subject}}
  A kód tölti a változókat: brand_initial, from_name, tagline, heading, intro,
  {{{actions}}} (nyers HTML Hívás/Válasz gombok a vállalkozás elérhetőségeivel —
  üresnél nem jelenik meg), {{{details}}} (nyers HTML-tábla, HÁROM kapcsos!), footer_note.
  Akcentus: Kvitli kék (#2378be) + zöld visszaigazolás (#37b24d).
-->
<div style="margin: 0; padding: 0; background: #eef1f8">
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="
      background: #eef1f8;
      padding: 32px 12px;
      font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
    "
  >
    <tr>
      <td align="center">
        <table
          role="presentation"
          width="600"
          cellpadding="0"
          cellspacing="0"
          style="
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dbe2f0;
            border-radius: 12px;
            overflow: hidden;
          "
        >
          <!-- Zöld visszaigazolás-akcentus (recipiens-megkülönböztető) -->
          <tr>
            <td style="height: 4px; line-height: 4px; font-size: 0; background: #37b24d">&nbsp;</td>
          </tr>

          <tr>
            <td style="padding: 24px 34px 20px 34px; border-bottom: 1px solid #e4eaf5">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td
                          style="
                            width: 44px;
                            height: 44px;
                            background: #2378be;
                            border-radius: 10px;
                            color: #ffffff;
                            font-size: 20px;
                            font-weight: 800;
                            text-align: center;
                            line-height: 44px;
                            font-family: -apple-system, &quot;Segoe UI&quot;, Arial, sans-serif;
                          "
                        >
                          {{brand_initial}}
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="vertical-align: middle; padding-left: 13px">
                    <div style="font-size: 17px; font-weight: 800; color: #171c28; letter-spacing: -0.02em">
                      {{from_name}}
                    </div>
                    <div
                      style="
                        font-size: 11.5px;
                        font-weight: 600;
                        color: #2378be;
                        letter-spacing: 0.04em;
                        text-transform: uppercase;
                        margin-top: 2px;
                      "
                    >
                      {{tagline}}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding: 28px 34px 8px 34px">
              <!-- Zöld pipa-jelvény: vizuális visszaigazolás -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 16px 0">
                <tr>
                  <td
                    style="
                      width: 40px;
                      height: 40px;
                      background: #eafaef;
                      border-radius: 999px;
                      color: #2b8a3e;
                      font-size: 22px;
                      font-weight: 800;
                      text-align: center;
                      line-height: 40px;
                    "
                  >
                    &#10003;
                  </td>
                </tr>
              </table>
              <h1
                style="
                  margin: 0 0 12px 0;
                  font-size: 23px;
                  line-height: 1.25;
                  font-weight: 800;
                  color: #171c28;
                  letter-spacing: -0.02em;
                "
              >
                {{heading}}
              </h1>
              <p style="margin: 0 0 18px 0; font-size: 14px; line-height: 1.65; color: #5d6b85">{{intro}}</p>
              {{{actions}}}
            </td>
          </tr>

          <tr>
            <td style="padding: 0 34px 8px 34px">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                {{{details}}}
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding: 26px 34px 30px 34px">
              <div
                style="
                  background: #eef1f8;
                  border-left: 3px solid #2378be;
                  border-radius: 0 8px 8px 0;
                  padding: 12px 15px;
                  font-size: 12.5px;
                  color: #2b3550;
                  line-height: 1.6;
                "
              >
                {{footer_note}}
              </div>
            </td>
          </tr>
        </table>

        <div
          style="
            max-width: 600px;
            margin: 16px auto 0 auto;
            text-align: center;
            font-size: 11px;
            color: #8a94ac;
            font-family: -apple-system, &quot;Segoe UI&quot;, Arial, sans-serif;
          "
        >
          Ezt az e-mailt a <strong style="color: #2378be">Kvitli</strong> küldte a
          weboldalad megrendelő-űrlapja alapján.
        </div>
      </td>
    </tr>
  </table>
</div>
