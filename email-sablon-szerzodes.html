<div style="margin: 0; padding: 0; background: #eef1f8">
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="
      background: #eef1f8;
      padding: 28px 12px;
      font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
    "
  >
    <tr>
      <td align="center">
        <table
          role="presentation"
          width="680"
          cellpadding="0"
          cellspacing="0"
          style="
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dbe2f0;
            border-radius: 12px;
            overflow: hidden;
          "
        >
          <tr>
            <td style="padding: 24px 30px 18px 30px; border-bottom: 1px solid #e4eaf5">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td
                          style="
                            width: 42px;
                            height: 42px;
                            background: #3b5bdb;
                            border-radius: 10px;
                            color: #ffffff;
                            font-size: 19px;
                            font-weight: 800;
                            text-align: center;
                            line-height: 42px;
                          "
                        >
                          {{brand_initial}}
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="vertical-align: middle; padding-left: 12px">
                    <div style="font-size: 16px; font-weight: 800; color: #171c28; letter-spacing: -0.02em">
                      {{from_name}}
                    </div>
                    <div
                      style="
                        font-size: 11px;
                        font-weight: 600;
                        color: #3b5bdb;
                        letter-spacing: 0.04em;
                        text-transform: uppercase;
                        margin-top: 2px;
                      "
                    >
                      {{tagline}}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding: 26px 30px 6px 30px">
              <h1
                style="
                  margin: 0 0 10px 0;
                  font-size: 21px;
                  line-height: 1.25;
                  font-weight: 800;
                  color: #171c28;
                  letter-spacing: -0.02em;
                "
              >
                {{heading}}
              </h1>
              <p style="margin: 0 0 14px 0; font-size: 14px; line-height: 1.6; color: #5d6b85">{{intro}}</p>
              <a
                href="mailto:{{action_mail}}?subject=Elfogadom%20a%20megb%C3%ADz%C3%A1si%20szerz%C5%91d%C3%A9st"
                style="
                  display: inline-block;
                  background: #3b5bdb;
                  color: #ffffff;
                  font-weight: 700;
                  font-size: 14px;
                  padding: 11px 20px;
                  border-radius: 10px;
                  text-decoration: none;
                  margin: 2px 8px 10px 0;
                "
                >&#10003; Elfogadom a szerződést</a
              >
            </td>
          </tr>

          <tr>
            <td style="padding: 8px 30px 26px 30px; border-top: 1px solid #e4eaf5">{{{details}}}</td>
          </tr>
        </table>
        <div style="max-width: 680px; margin: 14px auto 0 auto; text-align: center; font-size: 11px; color: #8a94ac">
          Ezt a szerződést a
          <strong style="color: #3b5bdb">Rend<span style="color: #3b5bdb">li</span></strong> állította össze. Nyomtatás
          / PDF: a leveled menüjéből.
        </div>
      </td>
    </tr>
  </table>
</div>
